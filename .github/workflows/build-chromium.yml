name: Build Chromium

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        include:
          - os: linux
            platform: linux_x64
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          quilt \
          python3 \
          python3-pip \
          curl \
          wget \
          git \
          pkg-config \
          ninja-build \
          build-essential \
          flex \
          bison \
          gperf \
          libegl1-mesa-dev \
          libgles2-mesa-dev \
          libx11-dev \
          libxext-dev \
          libxfixes-dev \
          libxrandr-dev \
          libxss-dev \
          libxt-dev \
          libxtst-dev \
          libxcursor-dev \
          libxcomposite-dev \
          libxi-dev \
          libxinerama-dev \
          libxdamage-dev \
          libfreetype6-dev \
          libpulse-dev \
          libpci-dev \
          libtorrent-rasterbar-dev \
          libsnappy-dev \
          libsrtp2-dev \
          libudev-dev \
          libva-dev \
          libvpx-dev \
          libxslt1-dev \
          libzip-dev \
          libzstd-dev
        python3 -m pip install httplib2 six pysocks
    
    - name: Setup depot_tools
      run: |
        cd ${{ github.workspace }}
        git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git depot_tools
        echo "${PWD}/depot_tools" >> $GITHUB_PATH
      timeout-minutes: 10
    
    - name: Create build directories
      run: |
        mkdir -p build
        cd build
    
    - name: Download Chromium source with gclient
      run: |
        cd ${{ github.workspace }}/build
        fetch --nohooks chromium
        cd src
        gclient runhooks
      timeout-minutes: 180
    
    - name: Apply ungoogled-chromium patches
      run: |
        cd ${{ github.workspace }}
        ./utils/patches.py apply build/src patches
      timeout-minutes: 30
    
    - name: Prune binaries
      run: |
        cd ${{ github.workspace }}
        ./utils/prune_binaries.py build/src pruning.list
      timeout-minutes: 20
    
    - name: Apply domain substitution
      run: |
        cd ${{ github.workspace }}
        ./utils/domain_substitution.py apply -r domain_regex.list -f domain_substitution.list -c build/domsubcache.tar.gz build/src
      timeout-minutes: 30
    
    - name: Install Linux sysroot
      run: |
        cd ${{ github.workspace }}/build/src
        python3 build/linux/sysroot_scripts/install-sysroot.py --arch=amd64
      timeout-minutes: 60
    
    - name: Build GN
      run: |
        mkdir -p ${{ github.workspace }}/build/src/out/Default
        cd ${{ github.workspace }}/build/src
        python3 tools/gn/bootstrap/bootstrap.py --skip-generate-buildfiles -j4 -o out/Default/
      timeout-minutes: 60
    
    - name: Generate build files
      run: |
        cd ${{ github.workspace }}/build/src
        cp ${{ github.workspace }}/flags.gn out/Default/args.gn
        ./out/Default/gn gen out/Default --fail-on-unused-args
      timeout-minutes: 30
    
    - name: Build Chromium
      run: |
        cd ${{ github.workspace }}/build/src
        ninja -C out/Default chrome chromedriver chrome_sandbox -j4
      timeout-minutes: 240
    
    - name: Upload build artifacts
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: chromium-build-${{ matrix.platform }}
        path: |
          ${{ github.workspace }}/build/src/out/Default/chrome
          ${{ github.workspace }}/build/src/out/Default/chromedriver
          ${{ github.workspace }}/build/src/out/Default/chrome_sandbox
        retention-days: 30
    
    - name: Upload logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs-${{ matrix.platform }}
        path: |
          ${{ github.workspace }}/build/src/out/Default/
        retention-days: 5
